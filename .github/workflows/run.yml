name: vps-relay

on:
  workflow_dispatch:
    inputs:
      receive:
        description: "استقبل الملفات من الجهاز التاني"
        required: false
        default: "false"
  schedule:
    - cron: '15,35,55 * * * *'

env:
  MY_NAME: vps-s
  PEER_NAME: vps-g
  PEER_REPO: galaljiu86-sudo/G
  PEER_BRANCH: main
  WORKFLOW_FILE: run.yml
  START_CMD: "bash start.sh"
  HANDOFF_MIN: "280"
  LAST_MIN: "350"
  READY_WAIT_SEC: "180"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: حارس يمنع تكرار التشغيل
        id: guard
        if: github.event_name == 'schedule'
        env:
          PAT: ${{ secrets.PAT }}
          GHT: ${{ github.token }}
        run: |
          count() {
            local tok="$1" repo="$2" status="$3" out
            out=$(curl -sf --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer $tok" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$repo/actions/runs?status=$status&per_page=1" | jq -r '.total_count // "ERR"' 2>/dev/null) || out="ERR"
            echo "$out"
          }
          me_prog=$(count "$GHT" "${{ github.repository }}" in_progress)
          me_q=$(count "$GHT" "${{ github.repository }}" queued)
          peer_prog=$(count "$PAT" "$PEER_REPO" in_progress)
          peer_q=$(count "$PAT" "$PEER_REPO" queued)
          echo "me=($me_prog,$me_q) peer=($peer_prog,$peer_q)"
          if [ "$me_prog" = "ERR" ] || [ "$me_q" = "ERR" ] || [ "$peer_prog" = "ERR" ] || [ "$peer_q" = "ERR" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "تعذّر التحقق من GitHub API بأمان، سيتم تخطي هذه الدورة."
            exit 0
          fi
          me=$(( me_prog + me_q ))
          peer=$(( peer_prog + peer_q ))
          if [ "$me" -gt 1 ] || [ "$peer" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "سلسلة أخرى نشطة حالياً، سيتم الخروج."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - name: علّم وقت البداية
        if: steps.guard.outputs.skip != 'true'
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: تثبيت المتطلبات وأدوات الشبكة
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq ffmpeg mbuffer python3-venv > /dev/null
          python3 -m venv "$HOME/.venv"
          "$HOME/.venv/bin/pip" install --no-cache-dir --upgrade pip -q
          "$HOME/.venv/bin/pip" install --no-cache-dir -r requirements.txt
          echo "$HOME/.venv/bin" >> "$GITHUB_PATH"

      - name: الاتصال بشبكة Tailscale (دائم لا ينتهي)
        if: steps.guard.outputs.skip != 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && 'tag:ci' || '' }}
          hostname: ${{ env.MY_NAME }}
          args: --ssh

      - name: استقبل وتخزين ملفات الداتا من الرانر السابق
        if: steps.guard.outputs.skip != 'true' && github.event.inputs.receive == 'true'
        run: |
          mkdir -p data
          rm -f /tmp/standby_mode
          echo "بانتظار وصول ملفات الداتا من الرانر القديم..."
          python3 - <<'PY'
          import io, json, os, shutil, socket, tarfile, tempfile

          s = socket.socket()
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind(("0.0.0.0", 9000))
          s.listen(1)
          s.settimeout(180)
          print("Receiver listening on port 9000...")
          received = False
          try:
              conn, addr = s.accept()
              buf = bytearray()
              while True:
                  chunk = conn.recv(65536)
                  if not chunk:
                      break
                  buf.extend(chunk)
                  if len(buf) > 10 * 1024 * 1024:
                      raise ValueError("Payload too large")
              conn.close()
              if buf:
                  with tempfile.TemporaryDirectory() as tmp:
                      with tarfile.open(fileobj=io.BytesIO(buf), mode="r:gz") as tar:
                          members = []
                          for m in tar.getmembers():
                              norm = os.path.normpath(m.name)
                              if os.path.isabs(norm) or norm.startswith(".."):
                                  continue
                              if norm in ("data/streams.json", "data/global.json"):
                                  members.append(m)
                          tar.extractall(tmp, members=members)
                      for fname in ("streams.json", "global.json"):
                          src = os.path.join(tmp, "data", fname)
                          if os.path.isfile(src):
                              with open(src, "r", encoding="utf-8") as f:
                                  json.load(f)
                              shutil.copy2(src, os.path.join("data", fname))
                  received = True
                  print("Data sync complete!")
          except Exception as exc:
              print(f"Notice: {exc}")
          finally:
              s.close()

          if received:
              with open("/tmp/standby_mode", "w", encoding="utf-8") as f:
                  f.write("1")
          PY
          ls -la data

      - name: تشغيل الخدمة وإعلان الجاهزية
        if: steps.guard.outputs.skip != 'true'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          MY_NAME: ${{ env.MY_NAME }}
        run: |
          mkdir -p data
          chmod +x start.sh
          rm -f /tmp/daemon_ready /tmp/bot_ready /tmp/supervisor_stop
          setsid nohup $START_CMD > out.log 2>&1 &

          ok=0
          for i in $(seq 1 $(( READY_WAIT_SEC / 2 ))); do
            if curl -sf --max-time 2 "http://127.0.0.1:9001/ready" > /dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 2
          done

          if [ "$ok" = 1 ]; then
            echo "✅ الخدمة والبوت يعملان بنجاح، الجهاز جاهز (Port 9001)"
          else
            echo "❌ فشل بدء الخدمة، تفاصيل السجلات:"
            cat out.log || true
            tail -n 50 data/bot.log || true
            tail -n 50 data/restreamer.log || true
            exit 1
          fi

      - name: تسليم الراية للجهاز التالي (Pre-warmed Sub-Second Handoff)
        if: steps.guard.outputs.skip != 'true'
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          elapsed() { echo $(( $(date +%s) - JOB_START )); }

          peer_runs() {
            for s in in_progress queued; do
              curl -sf --max-time 10 -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$PEER_REPO/actions/runs?status=$s&per_page=1" | jq '.total_count // 0' 2>/dev/null || echo 0
            done | awk '{n+=$1} END{print n+0}'
          }

          dispatch() {
            curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$PEER_REPO/actions/workflows/$WORKFLOW_FILE/dispatches" \
              -d "{\"ref\":\"$PEER_BRANCH\",\"inputs\":{\"receive\":\"true\"}}"
          }

          discover() {
            sudo tailscale status --json | jq -r --arg n "$PEER_NAME" \
              '[.Peer[]? | select(.Online==true) | select(.HostName|test("^"+$n+"(-[0-9]+)?$"))] | sort_by(.Created) | last | .TailscaleIPs[0] // empty'
          }

          wait=$(( HANDOFF_MIN*60 - $(elapsed) ))
          [ "$wait" -gt 0 ] && sleep "$wait"

          SENT=0; READY=0; LAST_DISPATCH=-9999
          while [ "$(elapsed)" -lt $(( LAST_MIN*60 )) ]; do
            IP=$(discover)

            if [ -z "$IP" ]; then
              SENT=0
              if [ $(( $(elapsed) - LAST_DISPATCH )) -ge 300 ] && [ "$(peer_runs)" -eq 0 ]; then
                echo "dispatch -> $(dispatch)"
                LAST_DISPATCH=$(elapsed)
              fi
            fi

            if [ -n "$IP" ] && [ "$SENT" = 0 ]; then
              python3 - <<PY && { SENT=1; echo "✅ تم نقل إعدادات data بنجاح!"; } || true
          import io, os, socket, tarfile
          s = socket.socket()
          s.settimeout(15)
          try:
              s.connect(("$IP", 9000))
              buf = io.BytesIO()
              with tarfile.open(fileobj=buf, mode="w:gz") as tar:
                  for fname in ("data/streams.json", "data/global.json"):
                      if os.path.isfile(fname):
                          tar.add(fname)
              s.sendall(buf.getvalue())
              s.close()
              print("SYNC_SUCCESS")
          except Exception as exc:
              print(f"SYNC_FAIL: {exc}")
              raise SystemExit(1)
          PY
            fi

            if [ -n "$IP" ] && curl -sf --max-time 5 "http://$IP:9001/ready" > /dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 10
          done

          if [ "$READY" = 1 ]; then
            echo "🔄 مزامنة أحدث الإعدادات قبل التسليم الفوري..."
            python3 - <<'PY' | curl -sf --max-time 5 -X POST -H "Content-Type: application/json" --data-binary @- "http://$IP:9001/sync" || true
          import json, os
          out = {}
          if os.path.isfile("data/streams.json"):
              with open("data/streams.json", "r", encoding="utf-8") as f:
                  out["streams"] = json.load(f)
          if os.path.isfile("data/global.json"):
              with open("data/global.json", "r", encoding="utf-8") as f:
                  out["global"] = json.load(f)
          print(json.dumps(out, ensure_ascii=False))
          PY

            echo "⚡ إيقاف البث المحلي (بدون FCUnpublish) وتفعيل الجهاز التالي خلال أقل من ثانية..."
            touch /tmp/supervisor_stop
            pkill -TERM -f "python3.*bot\.py" || true
            pkill -USR1 -f "python3.*restreamer\.py" || true
            pkill -USR1 -f "start\.sh" || true
            pkill -KILL -x ffmpeg || true
            pkill -KILL -x mbuffer || true

            for attempt in 1 2 3 4 5; do
              if curl -sf --max-time 5 -X POST "http://$IP:9001/activate" > /dev/null 2>&1; then
                echo "✅ تم التسليم والتفعيل الفوري بنجاح (المحاولة $attempt)!"
                break
              fi
              sleep 0.5
            done
          else
            echo "⚠️ تحذير: لم يستجب الجهاز الآخر، سيستمر العمل حتى الحد الأقصى."
            rest=$(( 356*60 - $(elapsed) ))
            [ "$rest" -gt 0 ] && sleep "$rest"
          fi

      - name: حفظ وتخزين بيانات البوت في المستودع احتياطياً
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          if [ -n "$PAT" ]; then
            git config --global user.name "bot-sync"
            git config --global user.email "bot@actions.local"
            for f in data/streams.json data/global.json; do
              [ -f "$f" ] && git add -f "$f"
            done
            if ! git diff --cached --quiet; then
              git commit -m "Auto-backup bot config [skip ci]" || true
              git push "https://${PAT}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }} || true
              echo "✅ تم حفظ إعدادات البوت في المستودع احتياطياً بنجاح."
            fi
          fi
