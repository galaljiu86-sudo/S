name: vps-relay

on:
  workflow_dispatch:
    inputs:
      receive:
        description: "استقبل الملفات من الجهاز التاني"
        required: false
        default: "false"
  schedule:
    - cron: '15,35,55 * * * *'

env:
  MY_NAME: vps-s
  PEER_NAME: vps-g
  PEER_REPO: galaljiu86-sudo/G
  PEER_BRANCH: main
  WORKFLOW_FILE: run.yml
  START_CMD: "bash start.sh"
  HANDOFF_MIN: "280"
  LAST_MIN: "350"
  READY_WAIT_SEC: "180"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: حارس يمنع تكرار التشغيل
        id: guard
        if: github.event_name == 'schedule'
        env:
          PAT: ${{ secrets.PAT }}
          GHT: ${{ github.token }}
        run: |
          count() {
            local tok="$1" repo="$2" status="$3" out
            out=$(curl -sf --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer $tok" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$repo/actions/runs?status=$status&per_page=1" | jq -r '.total_count // "ERR"' 2>/dev/null) || out="ERR"
            echo "$out"
          }
          me_prog=$(count "$GHT" "${{ github.repository }}" in_progress)
          me_q=$(count "$GHT" "${{ github.repository }}" queued)
          peer_prog=$(count "$PAT" "$PEER_REPO" in_progress)
          peer_q=$(count "$PAT" "$PEER_REPO" queued)
          echo "me=($me_prog,$me_q) peer=($peer_prog,$peer_q)"
          if [ "$me_prog" = "ERR" ] || [ "$me_q" = "ERR" ] || [ "$peer_prog" = "ERR" ] || [ "$peer_q" = "ERR" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "تعذّر التحقق من GitHub API بأمان، سيتم تخطي هذه الدورة."
            exit 0
          fi
          me=$(( me_prog + me_q ))
          peer=$(( peer_prog + peer_q ))
          if [ "$me" -gt 1 ] || [ "$peer" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "سلسلة أخرى نشطة حالياً، سيتم الخروج."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - name: علّم وقت البداية
        if: steps.guard.outputs.skip != 'true'
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: تثبيت المتطلبات وأدوات الشبكة
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq ffmpeg mbuffer python3-venv > /dev/null
          python3 -m venv "$HOME/.venv"
          "$HOME/.venv/bin/pip" install --no-cache-dir --upgrade pip -q
          "$HOME/.venv/bin/pip" install --no-cache-dir -r requirements.txt
          echo "$HOME/.venv/bin" >> "$GITHUB_PATH"

      - name: الاتصال بشبكة Tailscale (دائم لا ينتهي)
        if: steps.guard.outputs.skip != 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && 'tag:ci' || '' }}
          hostname: ${{ env.MY_NAME }}
          args: --ssh

      - name: استقبل وتخزين ملفات الداتا من الرانر السابق
        if: steps.guard.outputs.skip != 'true' && github.event.inputs.receive == 'true'
        run: |
          mkdir -p data
          rm -f /tmp/standby_mode
          echo "بانتظار وصول ملفات الداتا من الرانر القديم..."
          python3 - <<'PY'
          import io, json, os, shutil, socket, tarfile, tempfile

          s = socket.socket()
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind(("0.0.0.0", 9000))
          s.listen(1)
          s.settimeout(180)
          print("Receiver listening on port 9000...")
          received = False
          try:
              conn, addr = s.accept()
              buf = bytearray()
              while True:
                  chunk = conn.recv(65536)
                  if not chunk:
                      break
                  buf.extend(chunk)
                  if len(buf) > 10 * 1024 * 1024:
                      raise ValueError("Payload too large")
              conn.close()
              if buf:
                  with tempfile.TemporaryDirectory() as tmp:
                      with tarfile.open(fileobj=io.BytesIO(buf), mode="r:gz") as tar:
                          members = []
                          for m in tar.getmembers():
                              norm = os.path.normpath(m.name)
                              if os.path.isabs(norm) or norm.startswith(".."):
                                  continue
                              if norm in ("data/streams.json", "data/global.json"):
                                  members.append(m)
                          tar.extractall(tmp, members=members)
                      for fname in ("streams.json", "global.json"):
                          src = os.path.join(tmp, "data", fname)
                          if os.path.isfile(src):
                              with open(src, "r", encoding="utf-8") as f:
                                  json.load(f)
                              shutil.copy2(src, os.path.join("data", fname))
                  received = True
                  print("Data sync complete!")
          except Exception as exc:
              print(f"Notice: {exc}")
          finally:
              s.close()

          if received:
              with open("/tmp/standby_mode", "w", encoding="utf-8") as f:
                  f.write("1")
          PY
          ls -la data

      - name: تشغيل الخدمة وإعلان الجاهزية
        if: steps.guard.outputs.skip != 'true'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          MY_NAME: ${{ env.MY_NAME }}
        run: |
          mkdir -p data
          chmod +x start.sh
          rm -f /tmp/daemon_ready /tmp/bot_ready /tmp/supervisor_stop
          setsid
